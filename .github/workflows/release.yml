name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: make check-sync && make test
      - name: Build one zip per skill (for Claude.ai upload) + full bundle
        run: |
          make package
          (cd skills && zip -qr ../dist/seo-checklist-skills-all.zip . -x 'seo/*' '*/__pycache__/*')
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \[${GITHUB_REF_NAME#v}\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
